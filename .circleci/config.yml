version: 2.1
jobs:
  build:
    docker:
      - image: cimg/python:3.12
        environment:
          APP_CONFIG: config.TestingConfig
          DATABASE_URL: postgresql://postgres@localhost/test
          TEST_DATABASE_URL: postgresql://postgres@localhost/test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
      - image: cimg/redis:7.2
    steps:
      - checkout
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements/tests.txt
      - run: pytest tests/all --junitxml=test-results/junit.xml
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - store_test_results:
          path: test-results
workflows:
  ci:
    jobs:
      - build
